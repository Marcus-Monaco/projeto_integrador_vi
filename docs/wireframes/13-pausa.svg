<rect x="60" y="116" width="360" height="800" rx="4" fill="none" stroke="#3A3A3A" stroke-width="1.2"/>
<text x="240" y="950" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#8C8C8C" text-anchor="middle">360 × 800 dp  ·  1 px = 1 dp  ·  1080 × 2400 px @ xxhdpi</text>
<text x="476" y="126" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#8C8C8C" text-anchor="start" letter-spacing="1.4">ANOTAÇÕES DE COMPORTAMENTO E ESPECIFICAÇÃO</text>
<line x1="476" y1="134" x2="1016" y2="134" stroke="#C8C8C8" stroke-width="1"/>
<text x="476" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#2A6FB5" text-anchor="start" letter-spacing="1.1">ACESSO</text>
<line x1="476" y1="171" x2="1016" y2="171" stroke="#E3EDF7" stroke-width="2"/>
<circle cx="486" cy="184" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="504" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Botão de pausa no HUD</text>
<text x="504" y="203" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Ícone de 24 dp no canto superior direito, com área de toque expandida para</text>
<text x="504" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">48 dp. A pausa também é acionada automaticamente em onPause() — quando</text>
<text x="504" y="229" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">chega uma ligação ou o usuário troca de aplicativo.</text>
<text x="476" y="258" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#2A6FB5" text-anchor="start" letter-spacing="1.1">OPÇÕES</text>
<line x1="476" y1="263" x2="1016" y2="263" stroke="#E3EDF7" stroke-width="2"/>
<circle cx="486" cy="276" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="504" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Continuar</text>
<text x="504" y="295" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Retoma exatamente o estado congelado: posição e vetor da bola, posição do</text>
<text x="504" y="308" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">paddle, tijolos restantes. Uma contagem curta de 1 s antecede a retomada.</text>
<circle cx="486" cy="327" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="331" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="504" y="331" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Configurações durante a partida</text>
<text x="504" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Abre WF-04. Mudanças de cor valem imediatamente; mudanças de tamanho de</text>
<text x="504" y="359" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">tijolo só valem a partir do próximo nível, para não recriar a parede no</text>
<text x="504" y="372" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">meio da jogada.</text>
<text x="476" y="401" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#2A6FB5" text-anchor="start" letter-spacing="1.1">OBSERVAÇÃO</text>
<line x1="476" y1="406" x2="1016" y2="406" stroke="#E3EDF7" stroke-width="2"/>
<circle cx="486" cy="419" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="423" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="504" y="423" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Tela complementar</text>
<text x="504" y="438" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">A pausa não é exigida pelo enunciado, mas é necessária na prática: sem</text>
<text x="504" y="451" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">ela, uma interrupção do sistema faria o jogador perder a bola sem ter</text>
<text x="504" y="464" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">errado.</text>
