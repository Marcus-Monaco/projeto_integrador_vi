<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1060" viewBox="0 0 1060 1060" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
  <pattern id="hA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#8C8C8C" stroke-width="1.2"/>
  </pattern>
  <pattern id="hB" width="5" height="5" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="5" stroke="#6E6E6E" stroke-width="1.1"/>
    <line x1="0" y1="0" x2="5" y2="0" stroke="#6E6E6E" stroke-width="1.1"/>
  </pattern>
  <pattern id="hX" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="4" stroke="#EDEDED" stroke-width="1.6"/>
  </pattern>
  <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1" fill="#D8D8D8"/>
  </pattern>
  <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A6FB5"/>
  </marker>
</defs>
<rect x="0" y="0" width="1060" height="1060" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="60" y="46" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="800" fill="#1E1E1E" text-anchor="start" letter-spacing="-0.2">Splash / Abertura</text>
<text x="60" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5A5A5A" text-anchor="start">Primeira tela exibida ao abrir o aplicativo</text>
<text x="1016" y="46" font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#2A6FB5" text-anchor="end">WF-01</text>
<text x="1016" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8C8C8C" text-anchor="end">Brick Breaker · Projeto Integrador VI-A · wireframe v1</text>
<line x1="60" y1="88" x2="1016" y2="88" stroke="#3A3A3A" stroke-width="1.4"/>
<rect x="48" y="104" width="384" height="824" rx="34" fill="#FBFBFB" stroke="#3A3A3A" stroke-width="2"/>
<rect x="60" y="116" width="360" height="800" rx="4" fill="#FFFFFF" stroke="#C8C8C8" stroke-width="1"/>
<rect x="60" y="116" width="360" height="800" rx="0" fill="#F4F4F4" stroke="none" stroke-width="1"/>
<rect x="60" y="116" width="360" height="20" rx="0" fill="url(#dots)" stroke="none" stroke-width="1"/><line x1="60" y1="136" x2="420" y2="136" stroke="#C8C8C8" stroke-width="1" stroke-dasharray="4 3"/><text x="240" y="130" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="8.5" font-weight="400" fill="#8C8C8C" text-anchor="middle">status bar oculta — immersive sticky (requisito a)</text>
<rect x="176" y="352" width="128" height="128" rx="6" fill="#F4F4F4" stroke="#A9A9A9" stroke-width="1.3"/><line x1="176" y1="352" x2="304" y2="480" stroke="#A9A9A9" stroke-width="1"/><line x1="304" y1="352" x2="176" y2="480" stroke="#A9A9A9" stroke-width="1"/><text x="240" y="494" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#8C8C8C" text-anchor="middle">logotipo do jogo (vetorial)</text>
<text x="240" y="546" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#1E1E1E" text-anchor="middle" letter-spacing="3">BRICK BREAKER</text>
<text x="240" y="570" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5A5A5A" text-anchor="middle">Projeto Integrador VI-A</text>
<rect x="160" y="736" width="160" height="6" rx="3" fill="#D0D0D0" stroke="none" stroke-width="1"/>
<rect x="160" y="736" width="96" height="6" rx="3" fill="#6E6E6E" stroke="none" stroke-width="1"/>
<text x="240" y="764" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8C8C8C" text-anchor="middle">carregando recursos…</text>
<text x="240" y="880" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#8C8C8C" text-anchor="middle">versão 1.0.0 · Grupo XX</text>
<circle cx="148" cy="416" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="148" y="420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<circle cx="148" cy="739" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="148" y="743" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<circle cx="360" cy="248" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="360" y="252" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<rect x="60" y="116" width="360" height="800" rx="4" fill="none" stroke="#3A3A3A" stroke-width="1.2"/>
<text x="240" y="950" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#8C8C8C" text-anchor="middle">360 × 800 dp  ·  1 px = 1 dp  ·  1080 × 2400 px @ xxhdpi</text>
<text x="476" y="126" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#8C8C8C" text-anchor="start" letter-spacing="1.4">ANOTAÇÕES DE COMPORTAMENTO E ESPECIFICAÇÃO</text>
<line x1="476" y1="134" x2="1016" y2="134" stroke="#C8C8C8" stroke-width="1"/>
<text x="476" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#2A6FB5" text-anchor="start" letter-spacing="1.1">PROPÓSITO</text>
<line x1="476" y1="171" x2="1016" y2="171" stroke="#E3EDF7" stroke-width="2"/>
<circle cx="486" cy="184" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="504" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Identidade visual</text>
<text x="504" y="203" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Logotipo em vetor (VectorDrawable) para escalar sem perda em qualquer</text>
<text x="504" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">densidade. Fica centralizado vertical e horizontalmente, ocupando 128 ×</text>
<text x="504" y="229" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">128 dp.</text>
<circle cx="486" cy="248" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="252" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="504" y="252" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Pré-carregamento (duração fixa de 1,5 s)</text>
<text x="504" y="267" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Enquanto a barra avança, a Activity carrega o SoundPool (som de início de</text>
<text x="504" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">fase e som de rebatida no paddle), lê as preferências salvas de cor e</text>
<text x="504" y="293" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">tamanho de tijolo e infla as matrizes dos 5 níveis. Assim o primeiro nível</text>
<text x="504" y="306" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">inicia sem engasgo no game loop.</text>
<circle cx="486" cy="325" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="329" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="504" y="329" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Tela cheia desde o primeiro frame</text>
<text x="504" y="344" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Status bar e barra de navegação escondidas via WindowInsetsController</text>
<text x="504" y="357" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">(immersive sticky) já na SplashActivity, para não haver "pulo" de layout</text>
<text x="504" y="370" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">ao entrar no menu.</text>
<text x="476" y="399" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#2A6FB5" text-anchor="start" letter-spacing="1.1">INTERAÇÃO</text>
<line x1="476" y1="404" x2="1016" y2="404" stroke="#E3EDF7" stroke-width="2"/>
<circle cx="486" cy="417" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="421" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="504" y="421" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Sem interação do usuário</text>
<text x="504" y="436" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">A tela não responde a toques. Ao final do carregamento navega</text>
<text x="504" y="449" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">automaticamente para WF-02 (Menu principal), encerrando a si mesma</text>
<text x="504" y="462" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">(finish()) para não voltar na pilha.</text>
<line x1="60" y1="994" x2="1016" y2="994" stroke="#C8C8C8" stroke-width="1"/>
<text x="60" y="1016" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="700" fill="#8C8C8C" text-anchor="start" letter-spacing="1.2">REQUISITO ATENDIDO</text>
<text x="60" y="1034" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#1E1E1E" text-anchor="start">(a) ocupar a maior parte possível da tela · (e) pré-carga dos sons</text>
<text x="1016" y="1034" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8C8C8C" text-anchor="end">estado único</text>
</svg>
