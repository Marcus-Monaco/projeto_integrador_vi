<rect x="200" y="190" width="80" height="80" rx="6" fill="#F4F4F4" stroke="#A9A9A9" stroke-width="1.3"/><line x1="200" y1="190" x2="280" y2="270" stroke="#A9A9A9" stroke-width="1"/><line x1="280" y1="190" x2="200" y2="270" stroke="#A9A9A9" stroke-width="1"/>
<text x="240" y="310" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="800" fill="#1E1E1E" text-anchor="middle" letter-spacing="2.5">BRICK BREAKER</text>
<text x="240" y="332" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#8C8C8C" text-anchor="middle">toque em uma das opções</text>
<rect x="104" y="384" width="272" height="66" rx="8" fill="#A9A9A9" stroke="#3F3F3F" stroke-width="1.6"/><text x="240" y="422.67" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">JOGAR</text>
<rect x="104" y="466" width="272" height="58" rx="8" fill="#F4F4F4" stroke="#A9A9A9" stroke-width="1.4"/><text x="240" y="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle" letter-spacing="0.8">CONFIGURAÇÕES</text>
<rect x="104" y="540" width="272" height="58" rx="8" fill="#F4F4F4" stroke="#A9A9A9" stroke-width="1.4"/><text x="240" y="574" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle" letter-spacing="0.8">INTEGRANTES</text>
<rect x="156" y="628" width="168" height="40" rx="8" fill="none" stroke="#A9A9A9" stroke-width="1.2" stroke-dasharray="5 4"/><text x="240" y="652.33" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#5A5A5A" text-anchor="middle" letter-spacing="0.8">SAIR</text>
<text x="240" y="880" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#8C8C8C" text-anchor="middle">v1.0.0</text>
<line x1="104" y1="363" x2="104" y2="373" stroke="#2A6FB5" stroke-width="1"/><line x1="376" y1="363" x2="376" y2="373" stroke="#2A6FB5" stroke-width="1"/><line x1="104" y1="368" x2="376" y2="368" stroke="#2A6FB5" stroke-width="1" stroke-dasharray="3 2"/><rect x="215" y="360" width="50" height="16" rx="0" fill="#fff" stroke="none" stroke-width="1"/><text x="240" y="372" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2A6FB5" text-anchor="middle">272 dp</text>
<line x1="79" y1="384" x2="89" y2="384" stroke="#2A6FB5" stroke-width="1"/><line x1="79" y1="450" x2="89" y2="450" stroke="#2A6FB5" stroke-width="1"/><line x1="84" y1="384" x2="84" y2="450" stroke="#2A6FB5" stroke-width="1" stroke-dasharray="3 2"/><rect x="59" y="409" width="50" height="16" rx="0" fill="#fff" stroke="none" stroke-width="1"/><text x="84" y="421" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2A6FB5" text-anchor="middle">66 dp</text>
<line x1="60" y1="711" x2="60" y2="721" stroke="#2A6FB5" stroke-width="1"/><line x1="104" y1="711" x2="104" y2="721" stroke="#2A6FB5" stroke-width="1"/><line x1="60" y1="716" x2="104" y2="716" stroke="#2A6FB5" stroke-width="1" stroke-dasharray="3 2"/><rect x="57" y="708" width="50" height="16" rx="0" fill="#fff" stroke="none" stroke-width="1"/><text x="82" y="720" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2A6FB5" text-anchor="middle">44 dp</text>
<circle cx="402" cy="417" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="402" y="421" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<circle cx="402" cy="495" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="402" y="499" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<circle cx="402" cy="569" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="402" y="573" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<circle cx="240" cy="658" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="240" y="662" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<circle cx="90" cy="316" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="90" y="320" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<rect x="60" y="116" width="360" height="800" rx="4" fill="none" stroke="#3A3A3A" stroke-width="1.2"/>
<text x="240" y="950" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#8C8C8C" text-anchor="middle">360 × 800 dp  ·  1 px = 1 dp  ·  1080 × 2400 px @ xxhdpi</text>
<text x="476" y="126" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#8C8C8C" text-anchor="start" letter-spacing="1.4">ANOTAÇÕES DE COMPORTAMENTO E ESPECIFICAÇÃO</text>
<line x1="476" y1="134" x2="1016" y2="134" stroke="#C8C8C8" stroke-width="1"/>
<text x="476" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#2A6FB5" text-anchor="start" letter-spacing="1.1">AS TRÊS OPÇÕES OBRIGATÓRIAS (requisito b)</text>
<line x1="476" y1="171" x2="1016" y2="171" stroke="#E3EDF7" stroke-width="2"/>
<circle cx="486" cy="184" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="504" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Opção 1 — Integrantes</text>
<text x="504" y="203" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Abre WF-03, que lista nome e sobrenome de todos os integrantes do grupo.</text>
<text x="504" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Botão secundário: é informativo, não é o caminho principal.</text>
<circle cx="486" cy="235" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="239" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="504" y="239" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Opção 2 — Jogar</text>
<text x="504" y="254" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Botão primário (maior, alto contraste, no ponto de maior peso visual).</text>
<text x="504" y="267" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Inicia sempre pelo nível 1 e aplica as configurações salvas. Vai para</text>
<text x="504" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">WF-12 (transição) e em seguida WF-05.</text>
<circle cx="486" cy="299" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="303" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="504" y="303" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Opção 3 — Configurações</text>
<text x="504" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Abre WF-04, onde o usuário escolhe o padrão de cores e o tamanho dos</text>
<text x="504" y="331" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">tijolos que serão usados na geração da parede. As escolhas ficam</text>
<text x="504" y="344" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">persistidas e valem para as partidas seguintes.</text>
<text x="476" y="373" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#2A6FB5" text-anchor="start" letter-spacing="1.1">DEMAIS ELEMENTOS</text>
<line x1="476" y1="378" x2="1016" y2="378" stroke="#E3EDF7" stroke-width="2"/>
<circle cx="486" cy="391" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="395" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="504" y="395" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Sair (opcional, fora do enunciado)</text>
<text x="504" y="410" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Estilo terciário tracejado para deixar claro na revisão que é um extra e</text>
<text x="504" y="423" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">não uma das três opções exigidas.</text>
<circle cx="486" cy="442" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="446" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="504" y="446" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Área de marca</text>
<text x="504" y="461" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Logo + título ocupam o terço superior. Nenhum elemento interativo acima de</text>
<text x="504" y="474" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">268 dp, o que mantém todos os botões dentro do alcance do polegar.</text>
<text x="476" y="503" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#2A6FB5" text-anchor="start" letter-spacing="1.1">ESPECIFICAÇÃO</text>
<line x1="476" y1="508" x2="1016" y2="508" stroke="#E3EDF7" stroke-width="2"/>
<circle cx="486" cy="521" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="525" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="504" y="525" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Alvos de toque e espaçamento</text>
<text x="504" y="540" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Altura mínima de 48 dp em qualquer botão (recomendação de acessibilidade</text>
<text x="504" y="553" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">do Android); usamos 58–66 dp. Espaçamento vertical de 16 dp entre botões e</text>
<text x="504" y="566" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">margem lateral de 44 dp.</text>
<circle cx="486" cy="585" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="589" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<text x="504" y="589" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Comportamento do botão físico "voltar"</text>
<text x="504" y="604" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Nesta tela o gesto de voltar encerra o aplicativo (com confirmação). Nas</text>
<text x="504" y="617" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">demais telas ele retorna ao menu.</text>
<line x1="60" y1="994" x2="1016" y2="994" stroke="#C8C8C8" stroke-width="1"/>
<text x="60" y="1016" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="700" fill="#8C8C8C" text-anchor="start" letter-spacing="1.2">REQUISITO ATENDIDO</text>
<text x="60" y="1034" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#1E1E1E" text-anchor="start">(b) tela inicial com 3 opções · (a) tela cheia</text>
<text x="1016" y="1034" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8C8C8C" text-anchor="end">ponto de entrada da navegação</text>
</svg>
