<rect x="0" y="0" width="1060" height="1060" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="60" y="46" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="800" fill="#1E1E1E" text-anchor="start" letter-spacing="-0.2">Menu principal</text>
<text x="60" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5A5A5A" text-anchor="start">Tela inicial com as três opções exigidas no enunciado</text>
<text x="1016" y="46" font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#2A6FB5" text-anchor="end">WF-02</text>
<text x="1016" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8C8C8C" text-anchor="end">Brick Breaker · Projeto Integrador VI-A · wireframe v1</text>
<line x1="60" y1="88" x2="1016" y2="88" stroke="#3A3A3A" stroke-width="1.4"/>
<rect x="48" y="104" width="384" height="824" rx="34" fill="#FBFBFB" stroke="#3A3A3A" stroke-width="2"/>
<rect x="60" y="116" width="360" height="800" rx="4" fill="#FFFFFF" stroke="#C8C8C8" stroke-width="1"/>
