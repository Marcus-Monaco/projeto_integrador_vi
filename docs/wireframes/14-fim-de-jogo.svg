    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A6FB5"/>
  </marker>
</defs>
<rect x="0" y="0" width="1060" height="1060" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="60" y="46" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="800" fill="#1E1E1E" text-anchor="start" letter-spacing="-0.2">Fim de jogo / Vitória</text>
<text x="60" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#5A5A5A" text-anchor="start">Encerramento da partida — duas variantes do mesmo layout</text>
<text x="1016" y="46" font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#2A6FB5" text-anchor="end">WF-14</text>
<text x="1016" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8C8C8C" text-anchor="end">Brick Breaker · Projeto Integrador VI-A · wireframe v1</text>
<line x1="60" y1="88" x2="1016" y2="88" stroke="#3A3A3A" stroke-width="1.4"/>
<rect x="48" y="104" width="384" height="824" rx="34" fill="#FBFBFB" stroke="#3A3A3A" stroke-width="2"/>
<rect x="60" y="116" width="360" height="800" rx="4" fill="#FFFFFF" stroke="#C8C8C8" stroke-width="1"/>
<rect x="60" y="116" width="360" height="20" rx="0" fill="url(#dots)" stroke="none" stroke-width="1"/><line x1="60" y1="136" x2="420" y2="136" stroke="#C8C8C8" stroke-width="1" stroke-dasharray="4 3"/><text x="240" y="130" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="8.5" font-weight="400" fill="#8C8C8C" text-anchor="middle">status bar oculta — immersive sticky (requisito a)</text>
<rect x="60" y="116" width="360" height="800" rx="0" fill="#F4F4F4" stroke="none" stroke-width="1"/>
<text x="240" y="266" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="800" fill="#1E1E1E" text-anchor="middle" letter-spacing="3">FIM DE JOGO</text>
<text x="240" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#2A6FB5" text-anchor="middle">variante A — vidas esgotadas</text>
<line x1="120" y1="312" x2="360" y2="312" stroke="#C8C8C8" stroke-width="1"/>
<text x="84" y="348" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="start">Pontuação final</text>
<text x="396" y="348" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="800" fill="#1E1E1E" text-anchor="end">004 380</text>
<line x1="76" y1="362" x2="404" y2="362" stroke="#C8C8C8" stroke-width="1" stroke-dasharray="2 3"/>
<text x="84" y="394" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="start">Níveis concluídos</text>
<text x="396" y="394" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="800" fill="#1E1E1E" text-anchor="end">4 de 5</text>
<line x1="76" y1="408" x2="404" y2="408" stroke="#C8C8C8" stroke-width="1" stroke-dasharray="2 3"/>
<text x="84" y="440" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="start">Tijolos destruídos</text>
<text x="396" y="440" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="800" fill="#1E1E1E" text-anchor="end">138</text>
<line x1="76" y1="454" x2="404" y2="454" stroke="#C8C8C8" stroke-width="1" stroke-dasharray="2 3"/>
<text x="84" y="486" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="start">Melhor pontuação</text>
<text x="396" y="486" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="800" fill="#1E1E1E" text-anchor="end">005 120</text>
<line x1="76" y1="500" x2="404" y2="500" stroke="#C8C8C8" stroke-width="1" stroke-dasharray="2 3"/>
<rect x="104" y="564" width="272" height="56" rx="8" fill="#A9A9A9" stroke="#3F3F3F" stroke-width="1.6"/><text x="240" y="597.67" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">JOGAR NOVAMENTE</text>
<rect x="104" y="632" width="272" height="48" rx="8" fill="#F4F4F4" stroke="#A9A9A9" stroke-width="1.4"/><text x="240" y="661" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#1E1E1E" text-anchor="middle" letter-spacing="0.8">MENU PRINCIPAL</text>
<rect x="84" y="716" width="312" height="116" rx="10" fill="none" stroke="#2A6FB5" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="240" y="742" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="700" fill="#2A6FB5" text-anchor="middle" letter-spacing="1.2">VARIANTE B — VITÓRIA</text>
<text x="240" y="766" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A5A5A" text-anchor="middle">Mesmo layout, com o título trocado por</text>
<text x="240" y="784" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#5A5A5A" text-anchor="middle">"VOCÊ VENCEU!" e "Níveis concluídos: 5 de 5".</text>
<text x="240" y="810" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8C8C8C" text-anchor="middle">Alcançada ao concluir o nível 5 com vidas restantes.</text>
<circle cx="88" cy="264" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="88" y="268" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<circle cx="88" cy="416" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="88" y="420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<circle cx="88" cy="592" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="88" y="596" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<circle cx="72" cy="742" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="72" y="746" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<rect x="60" y="116" width="360" height="800" rx="4" fill="none" stroke="#3A3A3A" stroke-width="1.2"/>
<text x="240" y="950" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#8C8C8C" text-anchor="middle">360 × 800 dp  ·  1 px = 1 dp  ·  1080 × 2400 px @ xxhdpi</text>
<text x="476" y="126" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" fill="#8C8C8C" text-anchor="start" letter-spacing="1.4">ANOTAÇÕES DE COMPORTAMENTO E ESPECIFICAÇÃO</text>
<line x1="476" y1="134" x2="1016" y2="134" stroke="#C8C8C8" stroke-width="1"/>
<text x="476" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#2A6FB5" text-anchor="start" letter-spacing="1.1">DUAS VARIANTES DA MESMA TELA</text>
<line x1="476" y1="171" x2="1016" y2="171" stroke="#E3EDF7" stroke-width="2"/>
<circle cx="486" cy="184" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="504" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Variante A — fim de jogo</text>
<text x="504" y="203" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Exibida quando as vidas acabam. Substitui o diálogo WF-11, que só faz</text>
<text x="504" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">sentido enquanto ainda há vidas.</text>
<circle cx="486" cy="235" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="239" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="504" y="239" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Variante B — vitória</text>
<text x="504" y="254" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Exibida ao concluir o nível 5. Mesma estrutura, apenas título e mensagem</text>
<text x="504" y="267" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">diferentes — por isso é um único layout com duas variantes, e não duas</text>
<text x="504" y="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">telas.</text>
<text x="476" y="309" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#2A6FB5" text-anchor="start" letter-spacing="1.1">CONTEÚDO</text>
<line x1="476" y1="314" x2="1016" y2="314" stroke="#E3EDF7" stroke-width="2"/>
<circle cx="486" cy="327" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="331" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="504" y="331" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Resumo da partida</text>
<text x="504" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Pontuação final, níveis concluídos e tijolos destruídos. A melhor</text>
<text x="504" y="359" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">pontuação fica gravada em DataStore e sobrevive ao fechamento do</text>
<text x="504" y="372" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">aplicativo.</text>
<circle cx="486" cy="391" r="11" fill="#2A6FB5" stroke="none" stroke-width="1"/><text x="486" y="395" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="504" y="395" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#1E1E1E" text-anchor="start">Ações</text>
<text x="504" y="410" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">Jogar novamente reinicia do nível 1 zerando pontuação e vidas. Menu</text>
<text x="504" y="423" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#5A5A5A" text-anchor="start">principal volta a WF-02. Não há caminho de volta para a partida encerrada.</text>
<line x1="60" y1="994" x2="1016" y2="994" stroke="#C8C8C8" stroke-width="1"/>
<text x="60" y="1016" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="700" fill="#8C8C8C" text-anchor="start" letter-spacing="1.2">REQUISITO ATENDIDO</text>
<text x="60" y="1034" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#1E1E1E" text-anchor="start">complementar — fechamento do ciclo de partida</text>
<text x="1016" y="1034" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8C8C8C" text-anchor="end">variantes A e B</text>
</svg>
